<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barista's — Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #d9541e;
    --cream: #fbf2e0;
    --r-pill: 9999px;
    --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cream);
    font-family: var(--font);
  }
  .hero {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stage {
    position: relative;
    width: min(100vw, calc(100svh * 1.7556));
    aspect-ratio: 1264 / 720;
  }
  .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .logo {
    position: absolute;
    left: 4.5%;
    top: 7%;
    width: 47%;
    mix-blend-mode: multiply;
    opacity: 0;
    filter: blur(12px);
    transform: translateY(6px);
    transition: opacity 1.5s ease, filter 1.5s ease, transform 1.5s ease;
  }
  .cta-row {
    position: absolute;
    left: 4.5%;
    top: 52%;
    width: 47%;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    transition-delay: 1.3s;
  }
  .revealed .logo {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
  .revealed .cta-row {
    opacity: 1;
    transform: translateY(0);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 11px 22px;
    border: 1px solid transparent;
    border-radius: var(--r-pill);
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.95); }
  .btn-ghost {
    background: transparent;
    border-color: var(--primary);
    color: var(--primary);
  }
  @media (max-width: 620px) {
    .btn { min-height: 38px; padding: 8px 16px; font-size: 13px; }
    .cta-row {
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 20px;
    }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="stage" id="stage">
    <video id="heroVid" muted autoplay playsinline preload="auto">
      <source src="assets/Baristas Hero Vid.mp4" type="video/mp4">
    </video>
    <img class="logo" src="assets/hero-logo-crop.png?v=2" alt="Barista's — Good Friends, Great Coffee">
    <div class="cta-row">
      <a class="btn" href="https://order.online/store/baristas-coffee-house-tracy-1250787">Order ahead</a>
      <a class="btn btn-ghost" href="menu.html">See the menu</a>
    </div>
  </div>
</section>
<script>
  const vid = document.getElementById("heroVid");
  const stage = document.getElementById("stage");
  const reveal = () => stage.classList.add("revealed");
  vid.addEventListener("ended", () => setTimeout(reveal, 300));
  vid.play().catch(reveal);
</script>
</body>
</html>
